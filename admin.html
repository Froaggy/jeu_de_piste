<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration – Jeu de piste</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<section id="login" class="login" hidden>
  <form id="form-login">
    <h1>Administration</h1>
    <label>E-mail<input id="email" type="email" required autocomplete="username"></label>
    <label>Mot de passe<input id="mdp" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Se connecter</button>
    <p id="login-err" class="err"></p>
  </form>
</section>
<div id="app" hidden>
  <header class="top"><h1>Jeu de piste · Administration</h1>
    <div><button class="btn sec" id="rafraichir">Actualiser</button> <button class="btn sec" id="logout">Se déconnecter</button></div></header>
  <nav class="onglets"><button data-v="joueurs" class="actif">Participants</button><button data-v="erreurs">Erreurs par question</button></nav>
  <div id="vue-joueurs" class="grille">
    <aside><input id="recherche" type="search" placeholder="Rechercher un pseudo"><ul id="liste" class="liste"></ul></aside>
    <main id="detail"><p class="vide">Sélectionne un participant.</p></main>
  </div>
  <main id="vue-erreurs" hidden></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/questions.js"></script>
<script src="js/progression.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
